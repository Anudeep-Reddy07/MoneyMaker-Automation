name: Animal Video Generator

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Manual animal topic override (leave empty for AI-generated topic)"
        required: false
        default: ""

concurrency:
  group: animal-video-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 2

      - name: Build config.toml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python scripts/build_config.py

      - name: Pick animal video topic
        id: topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MANUAL_TOPIC: ${{ inputs.topic }}
        run: |
          TOPIC=$(python - <<'PY'
          import json, os, random, sys, urllib.request
          from pathlib import Path

          history_file = Path("scripts/animal_topic_history.json")
          fallback_topics = [
              "Why octopuses are smarter than you think",
              "How elephants communicate across huge distances",
              "The hidden intelligence of crows",
              "Why owls can fly almost silently",
              "How dolphins communicate with unique sounds",
              "The incredible survival skills of desert animals",
              "Why axolotls can regenerate body parts",
              "How ants build complex underground cities",
              "The surprising teamwork of wolves",
              "How bats use echolocation to navigate",
          ]

          def load_history():
              try:
                  return json.loads(history_file.read_text()).get("topics", [])[-20:] if history_file.exists() else []
              except Exception:
                  return []

          def save_topic(topic):
              try:
                  data = json.loads(history_file.read_text()) if history_file.exists() else {"topics": []}
                  data.setdefault("topics", []).append(topic)
                  data["topics"] = data["topics"][-100:]
                  history_file.write_text(json.dumps(data, indent=2) + "\n")
              except Exception as error:
                  print(f"Warning: Could not save topic history: {error}", file=sys.stderr)

          def generate_topic(recent_topics):
              prompt = f'''Generate exactly ONE fresh and engaging YouTube Shorts topic about animals or wildlife.
          Requirements: 7 to 12 words, curiosity-driven, suitable stock footage, animals or wildlife only, not generic, return only the topic title.
          Recently used topics:\n{chr(10).join(f'- {item}' for item in recent_topics) or 'None'}'''
              payload = {"model": "openai/gpt-oss-120b", "messages": [{"role": "system", "content": "Generate creative, curiosity-driven animal-focused YouTube Shorts topics."}, {"role": "user", "content": prompt}], "temperature": 0.9, "max_tokens": 100}
              request = urllib.request.Request("https://api.groq.com/openai/v1/chat/completions", data=json.dumps(payload).encode(), headers={"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}", "Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode())
              return result["choices"][0]["message"]["content"].strip().strip('"').strip("'").strip()

          manual_topic = os.environ.get("MANUAL_TOPIC", "").strip()
          recent_topics = load_history()
          if manual_topic:
              topic = manual_topic
          else:
              try:
                  topic = generate_topic(recent_topics)
              except Exception as error:
                  print(f"Groq generation failed: {error}", file=sys.stderr)
                  available = [item for item in fallback_topics if item not in recent_topics]
                  topic = random.choice(available or fallback_topics)
          if not topic:
              raise ValueError("Topic generation failed")
          save_topic(topic)
          print(topic)
          PY
          )
          echo "Selected animal topic: $TOPIC"
          {
            echo "topic<<EOF"
            echo "$TOPIC"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "### 🐾 Animal Video Topic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> $TOPIC" >> "$GITHUB_STEP_SUMMARY

      - name: Generate video
        id: generate
        run: |
          TASK_ID=$(python -c "import uuid; print(uuid.uuid4())")
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          uv run python cli.py \
            --task-id "$TASK_ID" \
            --video-subject "${{ steps.topic.outputs.topic }}" \
            --video-language en-US \
            --voice-name "en-US-AndrewNeural-Male" \
            --video-aspect 9:16 \
            --paragraph-number 2 \
            --video-count 1 \
            --bgm-type random \
            --bgm-volume 0.15
          VIDEO_FILE=$(find "storage/tasks/$TASK_ID" -name "*.mp4" -type f | head -1)
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"
          test -n "$VIDEO_FILE" || { echo "::error::No MP4 file found"; exit 1; }

      - name: Upload to YouTube
        id: upload
        if: steps.generate.outputs.video_file != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TOPIC="${{ steps.topic.outputs.topic }}"
          DESCRIPTION="🐾 $TOPIC

          Discover fascinating animal behavior, wildlife facts, and incredible facts from nature.

          #shorts #viral #trending #animals #wildlife #nature #animalfacts #interestingfacts #animalbehavior #wildlifefacts #naturelovers #facts"
          TAGS="shorts,youtube shorts,viral,trending,animals,wildlife,nature,animal facts,wildlife facts,interesting facts,animal behavior,nature facts,animal documentary,facts"
          uv run python scripts/upload_youtube.py \
            --video-file "${{ steps.generate.outputs.video_file }}" \
            --title "$TOPIC" \
            --description "$DESCRIPTION" \
            --tags "$TAGS" \
            --privacy public
          echo "### 📤 Animal Video Uploaded" >> "$GITHUB_STEP_SUMMARY"

      - name: Save animal topic history
        if: always()
        run: |
          if [ ! -f "scripts/animal_topic_history.json" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/animal_topic_history.json
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Update animal topic history"
            git pull --rebase origin "$(git branch --show-current)"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "ANIMAL VIDEO EXPERIMENT"
          echo "TOPIC: ${{ steps.topic.outputs.topic }}"
          echo "TASK ID: ${{ steps.generate.outputs.task_id }}"
          echo "VIDEO: ${{ steps.generate.outputs.video_file }}"
          echo "GENERATE: ${{ steps.generate.outcome }}"
          echo "UPLOAD: ${{ steps.upload.outcome }}"
