name: Animal Video Generator

on:
  schedule:
    # Every 3 hours, at 15 minutes past the hour
    - cron: "15 */3 * * *"

  workflow_dispatch:
    inputs:
      topic:
        description: "Manual animal topic override (leave empty for AI-generated topic)"
        required: false
        default: ""

concurrency:
  group: animal-video-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Setup ──────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 2

      # ── Build configuration ───────────────────────────────────────
      - name: Build config.toml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python scripts/build_config.py

      # ── Generate animal topic ──────────────────────────────────────
      - name: Pick animal video topic
        id: topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MANUAL_TOPIC: ${{ inputs.topic }}
        run: |
          TOPIC=$(python - <<'PY'
          import os
          import json
          import random
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          history_file = Path("scripts/animal_topic_history.json")

          fallback_topics = [
              "Why octopuses are smarter than you think",
              "How elephants communicate across huge distances",
              "The hidden intelligence of crows",
              "Why owls can fly almost silently",
              "How dolphins communicate with unique sounds",
              "The incredible survival skills of desert animals",
              "Why axolotls can regenerate body parts",
              "How ants build complex underground cities",
              "The surprising teamwork of wolves",
              "How bats use echolocation to navigate",
          ]

          def load_history():
              if not history_file.exists():
                  return []

              try:
                  data = json.loads(history_file.read_text())
                  return data.get("topics", [])[-20:]
              except Exception:
                  return []

          def save_topic(topic):
              try:
                  if history_file.exists():
                      data = json.loads(history_file.read_text())
                  else:
                      data = {"topics": []}

                  if "topics" not in data:
                      data["topics"] = []

                  data["topics"].append(topic)
                  data["topics"] = data["topics"][-100:]

                  history_file.write_text(
                      json.dumps(data, indent=2) + "\n"
                  )
              except Exception as error:
                  print(
                      f"Warning: Could not save topic history: {error}",
                      file=__import__("sys").stderr
                  )

          manual_topic = os.environ.get("MANUAL_TOPIC", "").strip()

          if manual_topic:
              topic = manual_topic
          else:
              recent_topics = load_history()
              recent_text = "\n".join(
                  f"- {item}" for item in recent_topics
              ) or "None"

              prompt = f"""
          Generate exactly ONE fresh and engaging YouTube Shorts topic
          about animals or wildlife.

          Possible themes:
          - Animal intelligence
          - Strange animal behavior
          - Wildlife survival
          - Animal communication
          - Hunting strategies
          - Evolutionary adaptations
          - Unbelievable animal facts
          - Animal relationships

          Recently used topics:
          {recent_text}

          Requirements:
          1. Generate a fresh topic.
          2. Do not repeat or closely rephrase recent topics.
          3. Use 7 to 12 words.
          4. Make it curiosity-driven and interesting.
          5. Ensure stock footage can be used.
          6. Discuss animals or wildlife only.
          7. Return ONLY the topic title.
          """

              try:
                  response = requests.post(
                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={
                          "Authorization": (
                              f"Bearer {os.environ['GROQ_API_KEY']}"
                          ),
                          "Content-Type": "application/json",
                      },
                      json={
                          "model": "openai/gpt-oss-120b",
                          "messages": [
                              {
                                  "role": "system",
                                  "content": (
                                      "Generate creative animal-focused "
                                      "YouTube Shorts topics."
                                  ),
                              },
                              {
                                  "role": "user",
                                  "content": prompt,
                              },
                          ],
                          "temperature": 0.9,
                          "max_tokens": 100,
                      },
                      timeout=30,
                  )

                  response.raise_for_status()

                  topic = (
                      response.json()["choices"][0]["message"]["content"]
                      .strip()
                      .strip('"')
                      .strip("'")
                      .strip()
                  )

                  if not topic:
                      raise ValueError("Empty topic returned by Groq")

              except Exception as error:
                  print(
                      f"Groq generation failed: {error}",
                      file=__import__("sys").stderr
                  )

                  available = [
                      item for item in fallback_topics
                      if item not in recent_topics
                  ]

                  topic = random.choice(
                      available or fallback_topics
                  )

          save_topic(topic)

          # Print only the topic to stdout.
          print(topic)
          PY
          )

          if [ -z "$TOPIC" ]; then
            echo "::error::Topic generation failed"
            exit 1
          fi

          echo "Selected animal topic: $TOPIC"

          {
            echo "topic<<EOF"
            echo "$TOPIC"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "### 🐾 Animal Video Topic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> $TOPIC" >> "$GITHUB_STEP_SUMMARY"

      # ── Generate video ─────────────────────────────────────────────
      - name: Generate video
        id: generate
        run: |
          TASK_ID=$(python -c "import uuid; print(uuid.uuid4())")

          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

          echo "Starting animal video generation..."
          echo "Task ID: $TASK_ID"
          echo "Topic: ${{ steps.topic.outputs.topic }}"

          uv run python cli.py \
            --task-id "$TASK_ID" \
            --video-subject "${{ steps.topic.outputs.topic }}" \
            --video-language en-US \
            --voice-name "en-US-AndrewNeural-Male" \
            --video-aspect 9:16 \
            --paragraph-number 2 \
            --video-count 1 \
            --bgm-type random \
            --bgm-volume 0.15

          VIDEO_FILE=$(find "storage/tasks/$TASK_ID" \
            -name "*.mp4" \
            -type f | head -1)

          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

          if [ -z "$VIDEO_FILE" ]; then
            echo "::error::No MP4 file found"

            ls -lR "storage/tasks/$TASK_ID" || true
            exit 1
          fi

          FILE_SIZE=$(stat --printf='%s' "$VIDEO_FILE" 2>/dev/null || stat -f '%z' "$VIDEO_FILE")
          FILE_SIZE_MB=$(echo "scale=1; $FILE_SIZE / 1048576" | bc)

          echo "### ✅ Animal Video Generated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task ID | \`$TASK_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Video | \`$VIDEO_FILE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | ${FILE_SIZE_MB} MB |" >> "$GITHUB_STEP_SUMMARY"

      # ── Upload to YouTube ──────────────────────────────────────────
      - name: Upload to YouTube
        id: upload
        if: steps.generate.outputs.video_file != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TOPIC="${{ steps.topic.outputs.topic }}"

          uv run python scripts/upload_youtube.py \
            --video-file "${{ steps.generate.outputs.video_file }}" \
            --title "$TOPIC" \
            --privacy public

          echo "### 📤 Animal Video Uploaded" >> "$GITHUB_STEP_SUMMARY"

      # ── Save topic history ─────────────────────────────────────────
      - name: Save animal topic history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/animal_topic_history.json

          if git diff --cached --quiet; then
            echo "No topic history changes to commit"
          else
            git commit -m "[skip ci] Update animal topic history"

            git pull --rebase origin "$(git branch --show-current)"

            git push
          fi

      # ── Final summary ──────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "  ANIMAL VIDEO EXPERIMENT"
          echo "  TOPIC:     ${{ steps.topic.outputs.topic }}"
          echo "  TASK ID:   ${{ steps.generate.outputs.task_id }}"
          echo "  VIDEO:     ${{ steps.generate.outputs.video_file }}"
          echo "  GENERATE:  ${{ steps.generate.outcome }}"
          echo "  UPLOAD:    ${{ steps.upload.outcome }}"
          echo "=========================================="
