name: Animal Video Generator

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Manual animal topic override"
        required: false
        default: ""

concurrency:
  group: animal-video-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 2

      - name: Build config.toml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python scripts/build_config.py

      - name: Pick animal video topic
        id: topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MANUAL_TOPIC: ${{ inputs.topic }}
        run: |
          TOPIC="$MANUAL_TOPIC"
          if [ -z "$TOPIC" ]; then
            TOPIC=$(python - <<'PY'
          import json, os, urllib.request
          prompt = "Generate exactly one curiosity-driven YouTube Shorts topic about animals or wildlife in 7 to 12 words. Return only the title."
          payload = {"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":prompt}],"temperature":0.9,"max_tokens":60}
          request = urllib.request.Request("https://api.groq.com/openai/v1/chat/completions", data=json.dumps(payload).encode(), headers={"Authorization":f"Bearer {os.environ['GROQ_API_KEY']}","Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode())
          print(result["choices"][0]["message"]["content"].strip().strip('"').strip("'"))
          PY
            )
          fi
          [ -n "$TOPIC" ] || { echo "::error::Topic generation failed"; exit 1; }
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "> $TOPIC" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate video
        id: generate
        run: |
          TASK_ID=$(python -c "import uuid; print(uuid.uuid4())")
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          uv run python cli.py \
            --task-id "$TASK_ID" \
            --video-subject "${{ steps.topic.outputs.topic }}" \
            --video-language en-US \
            --voice-name "en-US-AndrewNeural-Male" \
            --video-aspect 9:16 \
            --paragraph-number 2 \
            --video-count 1 \
            --bgm-type random \
            --bgm-volume 0.15
          VIDEO_FILE=$(find "storage/tasks/$TASK_ID" -name "*.mp4" -type f | head -1)
          [ -n "$VIDEO_FILE" ] || { echo "::error::No MP4 file found"; exit 1; }
          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        id: upload
        if: steps.generate.outputs.video_file != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TOPIC="${{ steps.topic.outputs.topic }}"
          DESCRIPTION="🐾 $TOPIC Discover fascinating animal behavior, wildlife facts, and incredible facts from nature.#shorts #viral #trending #animals #wildlife #nature #animalfacts #interestingfacts #animalbehavior #wildlifefacts #naturelovers #facts"
          TAGS="shorts,youtube shorts,viral,trending,animals,wildlife,nature,animal facts,wildlife facts,interesting facts,animal behavior,nature facts,animal documentary,facts"
          uv run python scripts/upload_youtube.py \
            --video-file "${{ steps.generate.outputs.video_file }}" \
            --title "$TOPIC" \
            --description "$DESCRIPTION" \
            --tags "$TAGS" \
            --privacy public

      - name: Save animal topic history
        if: always()
        run: |
          if [ -f scripts/animal_topic_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/animal_topic_history.json
            if ! git diff --cached --quiet; then
              git commit -m "[skip ci] Update animal topic history"
              git push
            fi
          fi

      - name: Summary
        if: always()
        run: |
          echo "TOPIC: ${{ steps.topic.outputs.topic }}"
          echo "GENERATE: ${{ steps.generate.outcome }}"
          echo "UPLOAD: ${{ steps.upload.outcome }}"
