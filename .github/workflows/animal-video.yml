name: Animal Video Generator

on:
  schedule:
    - cron: "15 */3 * * *"

  workflow_dispatch:
    inputs:
      topic:
        description: "Manual animal topic override"
        required: false
        default: ""

concurrency:
  group: animal-video-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 2

      - name: Build config.toml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python scripts/build_config.py

      - name: Pick animal video topic
        id: topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MANUAL_TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail

          TOPIC="$MANUAL_TOPIC"

          if [ -z "$TOPIC" ]; then
            TOPIC=$(python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GROQ_API_KEY")

          if not api_key:
              print("ERROR: GROQ_API_KEY is missing", file=sys.stderr)
              sys.exit(1)

          prompt = (
              "Generate exactly one curiosity-driven YouTube Shorts topic "
              "about animals or wildlife in 7 to 12 words. "
              "Return only the title, without quotation marks."
          )

          payload = {
              "model": "openai/gpt-oss-120b",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.9,
              "max_tokens": 60
          }

          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": f"Bearer {api_key}","Content-Type": "application/json","User-Agent": "Mozilla/5.0 (compatible; GitHubActions/1.0)"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  response_body = response.read().decode("utf-8")
                  result = json.loads(response_body)

          except urllib.error.HTTPError as error:
              error_body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  f"Groq API HTTP error: {error.code}",
                  file=sys.stderr
              )
              print(error_body, file=sys.stderr)
              sys.exit(1)

          except Exception as error:
              print(
                  f"Groq API request failed: {error}",
                  file=sys.stderr
              )
              sys.exit(1)

          try:
              topic = result["choices"][0]["message"]["content"].strip()
              topic = topic.strip('"').strip("'")

          except (KeyError, IndexError, TypeError) as error:
              print(
                  f"Unexpected Groq API response: {result}",
                  file=sys.stderr
              )
              print(f"Parsing error: {error}", file=sys.stderr)
              sys.exit(1)

          if not topic:
              print(
                  "ERROR: Groq returned an empty topic",
                  file=sys.stderr
              )
              sys.exit(1)

          print(topic)
          PY
            )
          fi

          if [ -z "$TOPIC" ]; then
            echo "::error::No topic was generated"
            exit 1
          fi

          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "> $TOPIC" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate video
        id: generate
        run: |
          set -euo pipefail

          TASK_ID=$(python -c "import uuid; print(uuid.uuid4())")

          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

          uv run python cli.py \
            --task-id "$TASK_ID" \
            --video-subject "${{ steps.topic.outputs.topic }}" \
            --video-language en-US \
            --voice-name "en-US-AndrewNeural-Male" \
            --video-aspect 9:16 \
            --paragraph-number 2 \
            --video-count 1 \
            --bgm-type random \
            --bgm-volume 0.15

          VIDEO_FILE=$(find "storage/tasks/$TASK_ID" \
            -name "*.mp4" \
            -type f | head -1)

          if [ -z "$VIDEO_FILE" ]; then
            echo "::error::No MP4 file found"
            exit 1
          fi

          echo "video_file=$VIDEO_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        id: upload
        if: steps.generate.outputs.video_file != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          TOPIC="${{ steps.topic.outputs.topic }}"

          DESCRIPTION="🐾 $TOPIC

          Discover fascinating animal behavior, wildlife facts, and incredible facts from nature.

          #shorts #viral #trending #animals #wildlife #nature #animalfacts #interestingfacts #animalbehavior #wildlifefacts #naturelovers #facts"

          TAGS="shorts,youtube shorts,viral,trending,animals,wildlife,nature,animal facts,wildlife facts,interesting facts,animal behavior,nature facts,animal documentary,facts"

          uv run python scripts/upload_youtube.py \
            --video-file "${{ steps.generate.outputs.video_file }}" \
            --title "$TOPIC" \
            --description "$DESCRIPTION" \
            --tags "$TAGS" \
            --privacy public

      - name: Save animal topic history
        if: always()
        run: |
          if [ -f scripts/animal_topic_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot].com"

            git add scripts/animal_topic_history.json

            if ! git diff --cached --quiet; then
              git commit -m "[skip ci] Update animal topic history"
              git push
            fi
          fi

      - name: Summary
        if: always()
        run: |
          echo "TOPIC: ${{ steps.topic.outputs.topic }}"
          echo "GENERATE: ${{ steps.generate.outcome }}"
          echo "UPLOAD: ${{ steps.upload.outcome }}"
